<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zevenstip</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <style>
    :root {
      --bg: #f7f6f2;
      --text: #28251d;
      --muted: #6f6a61;
      --accent: #b52d2d;
      --accent-dark: #202020;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      max-width: 680px;
      text-align: center;
      padding: 48px 32px;
      background: #fffdfa;
      border: 1px solid #e6e1d8;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }
    .bug {
      width: 84px;
      height: 84px;
      margin: 0 auto 20px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 2.2rem;
      letter-spacing: 0.02em;
    }
    p {
      margin: 0 auto 10px;
      line-height: 1.6;
      color: var(--muted);
      max-width: 34rem;
      font-size: 1.05rem;
    }
    .note {
      margin-top: 22px;
      font-size: 0.95rem;
    }
    .login-link {
      display: inline-block;
      margin-top: 24px;
      padding: 10px 22px;
      border-radius: 8px;
      background: var(--accent);
      color: #fffdfa;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <svg class="bug" viewBox="0 0 128 128" aria-label="Ladybug logo" role="img">
      <circle cx="64" cy="74" r="36" fill="#c63a3a"/>
      <circle cx="64" cy="38" r="16" fill="#202020"/>
      <rect x="61" y="42" width="6" height="66" rx="3" fill="#202020"/>
      <circle cx="47" cy="62" r="5" fill="#202020"/>
      <circle cx="39" cy="78" r="5" fill="#202020"/>
      <circle cx="49" cy="91" r="5" fill="#202020"/>
      <circle cx="81" cy="62" r="5" fill="#202020"/>
      <circle cx="89" cy="78" r="5" fill="#202020"/>
      <circle cx="79" cy="91" r="5" fill="#202020"/>
      <circle cx="64" cy="54" r="4" fill="#202020"/>
      <line x1="55" y1="27" x2="47" y2="18" stroke="#202020" stroke-width="4" stroke-linecap="round"/>
      <line x1="73" y1="27" x2="81" y2="18" stroke="#202020" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <h1>Zevenstip</h1>
    <p>Simple wellness tools for everyday practice.</p>
    <p>Meditation and physical exercise apps are in development.</p>
    <a class="login-link" href="/login/">Log in</a>
  </main>
</body>
</html>
