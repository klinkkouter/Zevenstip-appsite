<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Admin — Zevenstip</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    background: #f7f6f2;
    color: #1a1a18;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: #6b6a63; margin: 0 0 20px; }
  .card { background: #fff; border: 1px solid #e4e2da; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 4px; border-top: 1px solid #e4e2da; }
  th { color: #6b6a63; font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .role-tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #eeedfe; }
  label { display: block; font-size: 13px; color: #6b6a63; margin: 10px 0 4px; }
  input, select {
    width: 100%; font-family: inherit; font-size: 14px; padding: 8px 10px;
    border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;
  }
  button {
    font-family: inherit; font-size: 13px; padding: 6px 14px; border-radius: 8px;
    border: 1px solid #ccc; background: #fff; cursor: pointer;
  }
  button.primary { margin-top: 14px; width: 100%; background: #b3562e; color: #fff; border: none; font-weight: 600; padding: 10px; }
  .reset-btn { font-size: 12px; padding: 4px 10px; }
  .msg { font-size: 13px; margin: 8px 0 0; min-height: 16px; }
  .msg.error { color: #b3562e; }
  .msg.ok { color: #3a7d44; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .top-bar a { font-size: 13px; color: #b3562e; text-decoration: none; }
  .request-row { border-top: 1px solid #e4e2da; padding: 10px 0; }
  .request-row:first-child { border-top: none; }
  .request-name { font-weight: 600; font-size: 14px; }
  .request-email { color: #6b6a63; font-size: 13px; }
  .request-message { font-size: 13px; color: #55534c; margin: 4px 0 8px; }
  .request-actions { display: flex; gap: 8px; }
  .request-actions button.primary { width: auto; margin: 0; padding: 4px 10px; font-size: 12px; }
  .empty-note { font-size: 13px; color: #8a8880; margin: 0; }
</style>
</head>
<body>

<div class="top-bar">
  <div>
    <h1>Admin</h1>
    <p class="subtitle">Manage accounts</p>
  </div>
  <div>
    <a href="/admin/exercises/">Exercise library</a> &middot; <a href="/pt/">Back to app</a>
  </div>
</div>

<div class="card">
  <h2>Pending access requests</h2>
  <div id="requests-list"></div>
</div>

<div class="card">
  <h2>People</h2>
  <table id="users-table">
    <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>PT</th><th></th></tr></thead>
    <tbody id="users-body"></tbody>
  </table>
</div>

<div class="card">
  <h2>Add a person</h2>
  <form id="create-form">
    <label for="name">Name</label>
    <input type="text" id="name" required>
    <label for="email">Email</label>
    <input type="email" id="email" required>
    <label for="password">Initial password</label>
    <input type="text" id="password" required>
    <label for="role">Role</label>
    <select id="role">
      <option value="user">Regular user</option>
      <option value="pt">PT</option>
      <option value="admin">Admin</option>
    </select>
    <button class="primary" type="submit">Create account</button>
    <p class="msg" id="create-msg"></p>
  </form>
</div>

<script>
async function requireAdmin(){
  const res = await fetch('/api/auth/me');
  if (!res.ok) { window.location.href = '/login/?next=/admin/'; return null; }
  const user = await res.json();
  if (user.role !== 'admin') { window.location.href = '/pt/'; return null; }
  return user;
}

async function loadUsers(){
  const res = await fetch('/api/admin/users');
  if (!res.ok) return;
  const { users } = await res.json();
  const body = document.getElementById('users-body');
  body.innerHTML = '';
  const pts = users.filter(u => u.role === 'pt');
  users.forEach(u=>{
    const row = document.createElement('tr');
    row.innerHTML = '<td>'+u.name+'</td><td>'+u.email+'</td><td><span class="role-tag">'+u.role+'</span></td>';

    const ptCell = document.createElement('td');
    if (u.role === 'user') {
      const ptSelect = document.createElement('select');
      ptSelect.style.cssText = 'font-size:12px; padding:4px 6px;';
      const noneOpt = document.createElement('option');
      noneOpt.value = '';
      noneOpt.textContent = '— unassigned —';
      ptSelect.appendChild(noneOpt);
      pts.forEach(pt=>{
        const opt = document.createElement('option');
        opt.value = pt.id;
        opt.textContent = pt.name;
        if (u.pt_id === pt.id) opt.selected = true;
        ptSelect.appendChild(opt);
      });
      ptSelect.onchange = async ()=>{
        await fetch('/api/admin/users', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: u.id, ptId: ptSelect.value || null })
        });
      };
      ptCell.appendChild(ptSelect);
    }
    row.appendChild(ptCell);

    const actionCell = document.createElement('td');

    const programLink = document.createElement('a');
    programLink.className = 'reset-btn';
    programLink.style.cssText = 'display:inline-block; text-decoration:none;';
    programLink.href = '/admin/pt-program/?user=' + encodeURIComponent(u.id);
    programLink.textContent = 'PT program';
    actionCell.appendChild(programLink);

    const resetBtn = document.createElement('button');
    resetBtn.className = 'reset-btn';
    resetBtn.textContent = 'Reset password';
    resetBtn.onclick = async ()=>{
      const newPassword = prompt('New password for ' + u.name + ':');
      if (!newPassword) return;
      const res = await fetch('/api/admin/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: u.id, newPassword })
      });
      alert(res.ok ? 'Password updated.' : 'Could not update password.');
    };
    actionCell.appendChild(resetBtn);

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'reset-btn';
    deleteBtn.textContent = 'Delete';
    deleteBtn.onclick = async ()=>{
      if (!confirm('Delete ' + u.name + '\'s account? This also deletes their saved progress. This cannot be undone.')) return;
      const res = await fetch('/api/admin/users', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: u.id })
      });
      if (!res.ok) {
        const data = await res.json().catch(()=>({}));
        alert(data.error || 'Could not delete account.');
        return;
      }
      loadUsers();
    };
    actionCell.appendChild(deleteBtn);

    row.appendChild(actionCell);
    body.appendChild(row);
  });
}

document.getElementById('create-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const msg = document.getElementById('create-msg');
  msg.className = 'msg';
  msg.textContent = '';
  const body = {
    name: document.getElementById('name').value.trim(),
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value,
    role: document.getElementById('role').value
  };
  const res = await fetch('/api/admin/users', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const data = await res.json().catch(()=>({}));
    msg.className = 'msg error';
    msg.textContent = data.error || 'Could not create account.';
    return;
  }
  msg.className = 'msg ok';
  msg.textContent = 'Account created.';
  document.getElementById('create-form').reset();
  loadUsers();
});

async function loadRequests(){
  const res = await fetch('/api/admin/access-requests');
  if (!res.ok) return;
  const { requests } = await res.json();
  const list = document.getElementById('requests-list');
  list.innerHTML = '';
  if (!requests.length) {
    const empty = document.createElement('p');
    empty.className = 'empty-note';
    empty.textContent = 'No pending requests.';
    list.appendChild(empty);
    return;
  }
  requests.forEach(r=>{
    const row = document.createElement('div');
    row.className = 'request-row';
    row.innerHTML =
      '<div class="request-name">'+r.name+'</div>' +
      '<div class="request-email">'+r.email+'</div>' +
      (r.message ? '<div class="request-message">'+r.message+'</div>' : '');
    const actions = document.createElement('div');
    actions.className = 'request-actions';

    const createBtn = document.createElement('button');
    createBtn.className = 'primary';
    createBtn.textContent = 'Create account';
    createBtn.onclick = ()=>{
      document.getElementById('name').value = r.name;
      document.getElementById('email').value = r.email;
      document.getElementById('name').scrollIntoView({ behavior: 'smooth', block: 'center' });
    };

    const dismissBtn = document.createElement('button');
    dismissBtn.textContent = 'Dismiss';
    dismissBtn.onclick = async ()=>{
      await fetch('/api/admin/access-requests', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: r.id })
      });
      loadRequests();
    };

    actions.appendChild(createBtn);
    actions.appendChild(dismissBtn);
    row.appendChild(actions);
    list.appendChild(row);
  });
}

(async function init(){
  const user = await requireAdmin();
  if (!user) return;
  loadUsers();
  loadRequests();
})();
</script>
</body>
</html>
