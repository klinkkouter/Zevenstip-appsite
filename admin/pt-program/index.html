<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>PT program — Zevenstip</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    background: #f7f6f2;
    color: #1a1a18;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: #6b6a63; margin: 0 0 20px; }
  .card { background: #fff; border: 1px solid #e4e2da; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  .cat-group { background: #f7f6f2; border: 1px solid #e4e2da; border-radius: 10px; padding: 4px 14px 10px; margin-bottom: 12px; }
  .cat-group:last-child { margin-bottom: 0; }
  .cat-heading { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #b3562e; margin: 12px 0 4px; }
  .ex-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 8px 0; border-top: 1px solid #e4e2da; font-size: 14px; }
  .ex-row:first-child { border-top: none; }
  .ex-name { font-weight: 600; }
  .ex-detail { color: #6b6a63; font-size: 13px; }
  .ex-explanation { color: #8a8880; font-size: 12px; margin-top: 2px; }
  label { display: block; font-size: 13px; color: #6b6a63; margin: 10px 0 4px; }
  input, select {
    width: 100%; font-family: inherit; font-size: 14px; padding: 8px 10px;
    border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;
  }
  button {
    font-family: inherit; font-size: 13px; padding: 6px 14px; border-radius: 8px;
    border: 1px solid #ccc; background: #fff; cursor: pointer;
  }
  button.primary { margin-top: 14px; width: 100%; background: #b3562e; color: #fff; border: none; font-weight: 600; padding: 10px; }
  .small-btn { font-size: 12px; padding: 4px 10px; }
  .msg { font-size: 13px; margin: 8px 0 0; min-height: 16px; }
  .msg.error { color: #b3562e; }
  .msg.ok { color: #3a7d44; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .top-bar a { font-size: 13px; color: #b3562e; text-decoration: none; }
  .empty-note { font-size: 13px; color: #8a8880; margin: 0; }
</style>
</head>
<body>

<div class="top-bar">
  <div>
    <h1 id="page-title">PT program</h1>
    <p class="subtitle" id="page-subtitle">Loading…</p>
  </div>
  <a href="/admin/">&larr; Back to admin</a>
</div>

<div class="card">
  <h2>Assigned exercises</h2>
  <div id="assigned-list"></div>
</div>

<div class="card" id="edit-card" style="display:none;">
  <h2>Edit dosage</h2>
  <form id="edit-form">
    <label for="edit-detail">Dosage</label>
    <input type="text" id="edit-detail" required>
    <label for="edit-freq">Frequency</label>
    <select id="edit-freq">
      <option value="1">Once a day</option>
      <option value="2">Twice a day (AM/PM)</option>
    </select>
    <button class="primary" type="submit">Save</button>
    <p class="msg" id="edit-msg"></p>
  </form>
  <button type="button" id="cancel-edit" style="width:100%; margin-top:8px;">Cancel</button>
</div>

<div class="card">
  <h2>Assign from library</h2>
  <div id="available-list"></div>
</div>

<script>
const CAT_LABELS = { standing:'Standing', floor:'On the floor', seated:'Seated / feet', head:'Head & neck' };
const CAT_ORDER = ['standing', 'floor', 'seated', 'head'];
const userId = new URLSearchParams(window.location.search).get('user');

async function requireAdmin(){
  const res = await fetch('/api/auth/me');
  if (!res.ok) { window.location.href = '/login/?next=' + encodeURIComponent(window.location.pathname + window.location.search); return null; }
  const user = await res.json();
  if (user.role !== 'admin') { window.location.href = '/pt/'; return null; }
  return user;
}

async function loadPerson(){
  const res = await fetch('/api/admin/users');
  if (!res.ok) return;
  const { users } = await res.json();
  const person = users.find(u => u.id === userId);
  if (person) {
    document.getElementById('page-title').textContent = "PT program — " + person.name;
    document.getElementById('page-subtitle').textContent = person.email;
  } else {
    document.getElementById('page-subtitle').textContent = 'Person not found.';
  }
}

async function loadAssigned(){
  const res = await fetch('/api/admin/pt-assignments?userId=' + encodeURIComponent(userId));
  if (!res.ok) return [];
  const { assignments } = await res.json();
  const list = document.getElementById('assigned-list');
  list.innerHTML = '';
  if (!assignments.length) {
    const empty = document.createElement('p');
    empty.className = 'empty-note';
    empty.textContent = 'Nothing assigned yet.';
    list.appendChild(empty);
  }
  assignments.forEach(a=>{
    const row = document.createElement('div');
    row.className = 'ex-row';
    const left = document.createElement('div');
    left.innerHTML = '<div class="ex-name">'+a.name+'</div><div class="ex-detail">'+a.detail+(a.freq===2 ? ' · 2×/day' : '')+'</div><div class="ex-explanation">'+a.explanation+'</div>';
    row.appendChild(left);

    const actions = document.createElement('div');
    const editBtn = document.createElement('button');
    editBtn.className = 'small-btn';
    editBtn.textContent = 'Edit dosage';
    editBtn.onclick = ()=> startEdit(a);
    actions.appendChild(editBtn);

    const removeBtn = document.createElement('button');
    removeBtn.className = 'small-btn';
    removeBtn.textContent = 'Remove';
    removeBtn.onclick = async ()=>{
      if (!confirm('Remove "'+a.name+'" from this program?')) return;
      await fetch('/api/admin/pt-assignments', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: a.id })
      });
      refresh();
    };
    actions.appendChild(removeBtn);

    row.appendChild(actions);
    list.appendChild(row);
  });
  return assignments;
}

let editingAssignmentId = null;

function startEdit(a){
  editingAssignmentId = a.id;
  document.getElementById('edit-detail').value = a.detail;
  document.getElementById('edit-freq').value = String(a.freq);
  document.getElementById('edit-card').style.display = 'block';
  document.getElementById('edit-card').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function stopEdit(){
  editingAssignmentId = null;
  document.getElementById('edit-form').reset();
  document.getElementById('edit-card').style.display = 'none';
}

document.getElementById('cancel-edit').addEventListener('click', stopEdit);

document.getElementById('edit-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const msg = document.getElementById('edit-msg');
  msg.className = 'msg';
  msg.textContent = '';
  const res = await fetch('/api/admin/pt-assignments', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      id: editingAssignmentId,
      detail: document.getElementById('edit-detail').value.trim(),
      freq: Number(document.getElementById('edit-freq').value)
    })
  });
  if (!res.ok) {
    msg.className = 'msg error';
    msg.textContent = 'Could not save.';
    return;
  }
  stopEdit();
  refresh();
});

async function loadAvailable(assignedLibraryIds){
  const res = await fetch('/api/admin/exercise-library');
  if (!res.ok) return;
  const { exercises } = await res.json();
  const available = exercises.filter(ex => !assignedLibraryIds.has(ex.id));

  const list = document.getElementById('available-list');
  list.innerHTML = '';
  if (!available.length) {
    const empty = document.createElement('p');
    empty.className = 'empty-note';
    empty.textContent = 'Everything in the library is already assigned.';
    list.appendChild(empty);
    return;
  }

  const byCat = {};
  available.forEach(ex=>{
    if (!byCat[ex.cat]) byCat[ex.cat] = [];
    byCat[ex.cat].push(ex);
  });

  CAT_ORDER.filter(c=>byCat[c]).forEach(cat=>{
    const group = document.createElement('div');
    group.className = 'cat-group';
    const heading = document.createElement('p');
    heading.className = 'cat-heading';
    heading.textContent = CAT_LABELS[cat];
    group.appendChild(heading);

    byCat[cat].forEach(ex=>{
      const row = document.createElement('div');
      row.className = 'ex-row';
      const left = document.createElement('div');
      left.innerHTML = '<div class="ex-name">'+ex.name+'</div><div class="ex-detail">'+ex.detail+(ex.freq===2 ? ' · 2×/day' : '')+'</div>';
      row.appendChild(left);

      const assignBtn = document.createElement('button');
      assignBtn.className = 'small-btn';
      assignBtn.textContent = 'Assign';
      assignBtn.onclick = async ()=>{
        await fetch('/api/admin/pt-assignments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, libraryId: ex.id })
        });
        refresh();
      };
      row.appendChild(assignBtn);
      group.appendChild(row);
    });

    list.appendChild(group);
  });
}

async function refresh(){
  const assignments = await loadAssigned();
  const assignedLibraryIds = new Set((assignments || []).map(a => a.library_id));
  await loadAvailable(assignedLibraryIds);
}

(async function init(){
  const admin = await requireAdmin();
  if (!admin) return;
  if (!userId) {
    document.getElementById('page-subtitle').textContent = 'No person selected.';
    return;
  }
  loadPerson();
  refresh();
})();
</script>
</body>
</html>
