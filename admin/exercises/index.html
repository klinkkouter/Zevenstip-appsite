<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Exercise library — Zevenstip</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    background: #f7f6f2;
    color: #1a1a18;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: #6b6a63; margin: 0 0 20px; }
  .card { background: #fff; border: 1px solid #e4e2da; border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  .cat-group { background: #f7f6f2; border: 1px solid #e4e2da; border-radius: 10px; padding: 4px 14px 10px; margin-bottom: 12px; }
  .cat-group:last-child { margin-bottom: 0; }
  .cat-heading { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #b3562e; margin: 12px 0 4px; }
  .ex-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 8px 0; border-top: 1px solid #e4e2da; font-size: 14px; }
  .ex-row:first-child { border-top: none; }
  .ex-name { font-weight: 600; }
  .ex-detail { color: #6b6a63; font-size: 13px; }
  label { display: block; font-size: 13px; color: #6b6a63; margin: 10px 0 4px; }
  input, select, textarea {
    width: 100%; font-family: inherit; font-size: 14px; padding: 8px 10px;
    border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;
  }
  textarea { resize: vertical; min-height: 56px; }
  .ex-explanation { color: #8a8880; font-size: 12px; margin-top: 2px; }
  button {
    font-family: inherit; font-size: 13px; padding: 6px 14px; border-radius: 8px;
    border: 1px solid #ccc; background: #fff; cursor: pointer;
  }
  button.primary { margin-top: 14px; width: 100%; background: #b3562e; color: #fff; border: none; font-weight: 600; padding: 10px; }
  .delete-btn { font-size: 12px; padding: 4px 10px; }
  .msg { font-size: 13px; margin: 8px 0 0; min-height: 16px; }
  .msg.error { color: #b3562e; }
  .msg.ok { color: #3a7d44; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .top-bar a { font-size: 13px; color: #b3562e; text-decoration: none; }
</style>
</head>
<body>

<div class="top-bar">
  <div>
    <h1>Exercise library</h1>
    <p class="subtitle">The catalog PTs pick from to build a customer's PT program</p>
  </div>
  <a href="/admin/">&larr; Back to admin</a>
</div>

<div class="card">
  <h2>All exercises</h2>
  <div id="exercises-list"></div>
</div>

<div class="card">
  <h2 id="form-heading">Add an exercise</h2>
  <form id="create-form">
    <label for="name">Name</label>
    <input type="text" id="name" required>
    <label for="detail">Dosage (e.g. "2 × 15" or "3 × 30s hold")</label>
    <input type="text" id="detail" required>
    <label for="freq">Frequency</label>
    <select id="freq">
      <option value="1">Once a day</option>
      <option value="2">Twice a day (AM/PM)</option>
    </select>
    <label for="cat">Body position</label>
    <select id="cat">
      <option value="standing">Standing</option>
      <option value="floor">On the floor</option>
      <option value="seated">Seated / feet</option>
      <option value="head">Head & neck</option>
    </select>
    <label for="explanation">Explanation (the plain-English cue shown in the app)</label>
    <textarea id="explanation" required></textarea>
    <button class="primary" type="submit" id="submit-btn">Add to library</button>
    <p class="msg" id="create-msg"></p>
  </form>
  <button type="button" id="cancel-edit" style="display:none; width:100%; margin-top:8px;">Cancel edit</button>
</div>

<script>
const CAT_LABELS = { standing:'Standing', floor:'On the floor', seated:'Seated / feet', head:'Head & neck' };
const CAT_ORDER = ['standing', 'floor', 'seated', 'head'];

async function requireAdmin(){
  const res = await fetch('/api/auth/me');
  if (!res.ok) { window.location.href = '/login/?next=/admin/exercises/'; return null; }
  const user = await res.json();
  if (user.role !== 'admin') { window.location.href = '/pt/'; return null; }
  return user;
}

async function loadExercises(){
  const res = await fetch('/api/admin/exercise-library');
  if (!res.ok) return;
  const { exercises } = await res.json();
  const list = document.getElementById('exercises-list');
  list.innerHTML = '';
  const byCat = {};
  exercises.forEach(ex=>{
    if (!byCat[ex.cat]) byCat[ex.cat] = [];
    byCat[ex.cat].push(ex);
  });
  CAT_ORDER.filter(c=>byCat[c]).forEach(cat=>{
    const group = document.createElement('div');
    group.className = 'cat-group';

    const heading = document.createElement('p');
    heading.className = 'cat-heading';
    heading.textContent = CAT_LABELS[cat];
    group.appendChild(heading);

    byCat[cat].forEach(ex=>{
      const row = document.createElement('div');
      row.className = 'ex-row';
      const left = document.createElement('div');
      left.innerHTML = '<div class="ex-name">'+ex.name+'</div><div class="ex-detail">'+ex.detail+(ex.freq===2 ? ' · 2×/day' : '')+'</div><div class="ex-explanation">'+ex.explanation+'</div>';
      row.appendChild(left);

      const actions = document.createElement('div');

      const modifyBtn = document.createElement('button');
      modifyBtn.className = 'delete-btn';
      modifyBtn.textContent = 'Modify';
      modifyBtn.onclick = ()=> startEdit(ex);
      actions.appendChild(modifyBtn);

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = 'Delete';
      deleteBtn.onclick = async ()=>{
        if (!confirm('Remove "'+ex.name+'" from the library?')) return;
        await fetch('/api/admin/exercise-library', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: ex.id })
        });
        loadExercises();
      };
      actions.appendChild(deleteBtn);

      row.appendChild(actions);
      group.appendChild(row);
    });

    list.appendChild(group);
  });
}

let editingId = null;

function startEdit(ex){
  editingId = ex.id;
  document.getElementById('name').value = ex.name;
  document.getElementById('detail').value = ex.detail;
  document.getElementById('freq').value = String(ex.freq);
  document.getElementById('cat').value = ex.cat;
  document.getElementById('explanation').value = ex.explanation;
  document.getElementById('form-heading').textContent = 'Edit exercise';
  document.getElementById('submit-btn').textContent = 'Save changes';
  document.getElementById('cancel-edit').style.display = 'block';
  document.getElementById('name').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function stopEdit(){
  editingId = null;
  document.getElementById('create-form').reset();
  document.getElementById('form-heading').textContent = 'Add an exercise';
  document.getElementById('submit-btn').textContent = 'Add to library';
  document.getElementById('cancel-edit').style.display = 'none';
}

document.getElementById('cancel-edit').addEventListener('click', stopEdit);

document.getElementById('create-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const msg = document.getElementById('create-msg');
  msg.className = 'msg';
  msg.textContent = '';
  const body = {
    name: document.getElementById('name').value.trim(),
    detail: document.getElementById('detail').value.trim(),
    freq: Number(document.getElementById('freq').value),
    cat: document.getElementById('cat').value,
    explanation: document.getElementById('explanation').value.trim()
  };
  if (editingId) body.id = editingId;
  const res = await fetch('/api/admin/exercise-library', {
    method: editingId ? 'PUT' : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const data = await res.json().catch(()=>({}));
    msg.className = 'msg error';
    msg.textContent = data.error || 'Could not save exercise.';
    return;
  }
  msg.className = 'msg ok';
  msg.textContent = editingId ? 'Saved.' : 'Added.';
  stopEdit();
  loadExercises();
});

(async function init(){
  const user = await requireAdmin();
  if (!user) return;
  loadExercises();
})();
</script>
</body>
</html>
